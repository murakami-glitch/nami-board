<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16233d">
<title>ナミノオト業務ボード</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="https://murakami-glitch.github.io/nami-photo/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://murakami-glitch.github.io/nami-photo/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
<style>body{margin:0;background:#16233d;color:#fff;font-family:'Noto Sans JP',sans-serif}#boot{min-height:100vh;display:grid;place-items:center;text-align:center;font-size:14px;line-height:2}#boot img{width:96px;height:96px;border-radius:20px}#boot button{margin-top:14px;padding:12px 22px;border:1px solid #fff;border-radius:4px;background:none;color:#fff;font:inherit}</style>
</head>
<body>
<div id="boot"><div><img src="https://murakami-glitch.github.io/nami-photo/icon-192.png" alt=""><p id="boot-msg">読み込んでいます…</p></div></div>
<script>
(function () {
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbyNc6up3XKljFg0Fvvd_1gRWBoXw-xoGbqXlRox6ujeEy_UCPOIXf8qbdZzBn6Mhqro/exec';
  var KEY = 'nami-board.key', key = null;
  try {
    var m = location.hash.match(/[#&]k=([0-9a-f]{64})/);
    if (m) { localStorage.setItem(KEY, m[1]); history.replaceState(null, '', location.pathname); }
    key = localStorage.getItem(KEY);
  } catch (e) { key = null; }
  window.PHONE_APP = { hasKey: !!key, forget: function () { try { localStorage.removeItem(KEY); } catch (e) {} key = null; } };
  window.google = { script: { run: (function mk(ok, ng) {
    var h = { withSuccessHandler: function (fn) { return mk(fn, ng); }, withFailureHandler: function (fn) { return mk(ok, fn); } };
    h.api = function (action, payload) {
      fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ appKey: key, action: action, payload: payload || {} }) })
        .then(function (r) { return r.text(); }).then(function (t) { ok && ok(t); }).catch(function (e) { ng && ng(e); });
    };
    return h;
  })() } };
  window.BOOT = null;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  fetch(ENDPOINT + '?asset=app').then(function (r) { return r.json(); }).then(function (a) {
    if (!a || !a.ok) throw new Error('部品を受け取れませんでした');
    document.head.insertAdjacentHTML('beforeend', a.styles);
    document.body.innerHTML = a.body;
    var s = document.createElement('script');
    s.textContent = a.app;
    document.body.appendChild(s);
  }).catch(function (e) {
    document.getElementById('boot-msg').innerHTML = '読み込めませんでした。<br>ネットにつながっているか確かめてください。<br><button onclick="location.reload()">もう一度</button>';
  });
})();
</script>
</body>
</html>
